<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular cyan-tinted background -->
  <circle cx="140" cy="140" r="140" fill="#00BCD4" fill-opacity="0.1"/>

  <!-- Smartphone frame -->
  <rect x="85" y="50" width="110" height="200" rx="12" fill="#2C2C2C" stroke="#00BCD4" stroke-width="2"/>

  <!-- Screen area -->
  <rect x="92" y="62" width="96" height="176" fill="#1E1E1E"/>

  <!-- Notch -->
  <rect x="120" y="62" width="40" height="6" rx="3" fill="#2C2C2C"/>

  <!-- QR Code in center -->
  <g transform="translate(115, 110)">
    <rect width="50" height="50" fill="white" rx="2"/>
    <!-- QR code pattern -->
    <rect x="2" y="2" width="8" height="8" fill="black"/>
    <rect x="12" y="2" width="6" height="8" fill="black"/>
    <rect x="20" y="2" width="4" height="8" fill="black"/>
    <rect x="26" y="2" width="4" height="8" fill="black"/>
    <rect x="32" y="2" width="4" height="8" fill="black"/>
    <rect x="38" y="2" width="8" height="8" fill="black"/>

    <rect x="2" y="12" width="8" height="6" fill="black"/>
    <rect x="38" y="12" width="8" height="6" fill="black"/>

    <rect x="2" y="20" width="8" height="4" fill="black"/>
    <rect x="12" y="20" width="6" height="4" fill="black"/>
    <rect x="26" y="20" width="4" height="4" fill="black"/>
    <rect x="38" y="20" width="8" height="4" fill="black"/>

    <rect x="2" y="26" width="8" height="4" fill="black"/>
    <rect x="20" y="26" width="4" height="4" fill="black"/>
    <rect x="38" y="26" width="8" height="4" fill="black"/>

    <rect x="2" y="32" width="8" height="4" fill="black"/>
    <rect x="12" y="32" width="6" height="4" fill="black"/>
    <rect x="26" y="32" width="4" height="4" fill="black"/>
    <rect x="38" y="32" width="8" height="4" fill="black"/>

    <rect x="2" y="38" width="8" height="8" fill="black"/>
    <rect x="12" y="38" width="6" height="8" fill="black"/>
    <rect x="20" y="38" width="4" height="8" fill="black"/>
    <rect x="26" y="38" width="4" height="8" fill="black"/>
    <rect x="32" y="38" width="4" height="8" fill="black"/>
    <rect x="38" y="38" width="8" height="8" fill="black"/>
  </g>

  <!-- Cyan corner brackets around scan area -->
  <!-- Top-left bracket -->
  <path d="M 105 95 L 105 100 L 105 105 L 110 105" stroke="#00BCD4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Top-right bracket -->
  <path d="M 175 95 L 175 100 L 175 105 L 170 105" stroke="#00BCD4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Bottom-left bracket -->
  <path d="M 105 175 L 105 170 L 105 165 L 110 165" stroke="#00BCD4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Bottom-right bracket -->
  <path d="M 175 175 L 175 170 L 175 165 L 170 165" stroke="#00BCD4" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Scan line animation effect -->
  <line x1="105" y1="135" x2="175" y2="135" stroke="#00BCD4" stroke-width="2" opacity="0.6"/>
</svg>
