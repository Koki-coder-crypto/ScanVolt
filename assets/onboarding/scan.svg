<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BCD4" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00BCD4" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="phoneGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="50%" stop-color="#2E2E2E"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="screenGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="cyanGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00BCD4"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BCD4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00BCD4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="qrGlow1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00BCD4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00BCD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#00BCD4" flood-opacity="0.35"/>
    </filter>
    <clipPath id="scanArea">
      <rect x="100" y="90" width="80" height="90" rx="2"/>
    </clipPath>
  </defs>

  <circle cx="140" cy="140" r="140" fill="url(#bgGradient1)"/>
  <circle cx="140" cy="140" r="125" fill="none" stroke="#00BCD4" stroke-width="0.5" opacity="0.15"/>
  <circle cx="140" cy="140" r="110" fill="none" stroke="#00BCD4" stroke-width="0.5" opacity="0.1"/>
  <circle cx="140" cy="140" r="95" fill="none" stroke="#00BCD4" stroke-width="0.5" opacity="0.08"/>

  <circle cx="70" cy="90" r="2.5" fill="#00BCD4" opacity="0.5"/>
  <circle cx="210" cy="110" r="2" fill="#00E5FF" opacity="0.4"/>
  <circle cx="200" cy="190" r="2.5" fill="#00BCD4" opacity="0.45"/>
  <circle cx="80" cy="180" r="2" fill="#00E5FF" opacity="0.35"/>
  <circle cx="60" cy="80" r="1.5" fill="#00E5FF" opacity="0.7"/>
  <circle cx="220" cy="100" r="1.5" fill="#00BCD4" opacity="0.7"/>
  <circle cx="200" cy="200" r="1.5" fill="#00E5FF" opacity="0.7"/>

  <circle cx="140" cy="145" r="50" fill="url(#qrGlow1)"/>

  <g filter="url(#shadow1)">
    <rect x="83" y="48" width="114" height="204" rx="14" fill="#1A1A1A"/>
    <rect x="85" y="50" width="110" height="200" rx="13" fill="url(#phoneGradient1)"/>
    <rect x="85" y="50" width="110" height="2" rx="1" fill="#555555" opacity="0.5"/>
    <rect x="85" y="50" width="2" height="200" rx="1" fill="#555555" opacity="0.3"/>
    <rect x="85.5" y="50.5" width="109" height="199" rx="12.5" fill="none" stroke="url(#cyanGlow1)" stroke-width="2.5"/>
  </g>

  <rect x="92" y="62" width="96" height="176" fill="url(#screenGradient1)" rx="2"/>
  <rect x="120" y="62" width="40" height="6" rx="3" fill="#1C1C1C"/>
  <rect x="122" y="63" width="36" height="3" rx="1.5" fill="#2A2A2A"/>
  <circle cx="164" cy="65" r="1.5" fill="#1A3A3A"/>
  <circle cx="164" cy="65" r="0.8" fill="#00BCD4" opacity="0.3"/>
  <rect x="92" y="62" width="96" height="60" fill="url(#screenGradient1)" opacity="0.1" rx="2"/>

  <g transform="translate(115, 110)">
    <rect width="50" height="50" fill="#000000" opacity="0.2" rx="2.5" x="1" y="1"/>
    <rect width="50" height="50" fill="white" rx="2.5" filter="url(#glow1)"/>
    <rect x="1" y="1" width="48" height="48" fill="none" stroke="#F5F5F5" stroke-width="0.5" rx="2"/>
    <g fill="black">
      <rect x="3" y="3" width="13" height="13" rx="1"/>
      <rect x="5" y="5" width="9" height="9" rx="0.5" fill="white"/>
      <rect x="7" y="7" width="5" height="5" rx="0.5" fill="black"/>
      <rect x="34" y="3" width="13" height="13" rx="1"/>
      <rect x="36" y="5" width="9" height="9" rx="0.5" fill="white"/>
      <rect x="38" y="7" width="5" height="5" rx="0.5" fill="black"/>
      <rect x="3" y="34" width="13" height="13" rx="1"/>
      <rect x="5" y="36" width="9" height="9" rx="0.5" fill="white"/>
      <rect x="7" y="38" width="5" height="5" rx="0.5" fill="black"/>
    </g>
    <rect x="20" y="3" width="3" height="3" fill="#00BCD4"/>
    <rect x="24" y="3" width="2" height="3" fill="black"/>
    <rect x="27" y="3" width="2" height="3" fill="black"/>
    <rect x="30" y="3" width="2" height="3" fill="black"/>
    <rect x="3" y="18" width="3" height="3" fill="black"/>
    <rect x="7" y="18" width="3" height="3" fill="#00BCD4"/>
    <rect x="11" y="18" width="2" height="3" fill="black"/>
    <rect x="18" y="18" width="14" height="14" fill="none" stroke="#00BCD4" stroke-width="1.5" rx="1"/>
    <rect x="21" y="21" width="8" height="8" fill="#00BCD4" opacity="0.3"/>
    <rect x="23" y="23" width="4" height="4" fill="#00BCD4"/>
    <rect x="34" y="18" width="3" height="3" fill="black"/>
    <rect x="38" y="18" width="3" height="3" fill="black"/>
    <rect x="42" y="18" width="3" height="3" fill="#00BCD4"/>
    <rect x="18" y="34" width="3" height="3" fill="black"/>
    <rect x="22" y="34" width="2" height="3" fill="black"/>
    <rect x="25" y="34" width="3" height="3" fill="#00BCD4"/>
    <rect x="29" y="34" width="2" height="3" fill="black"/>
    <rect x="34" y="38" width="3" height="3" fill="black"/>
    <rect x="38" y="38" width="3" height="3" fill="#00BCD4"/>
    <rect x="42" y="38" width="3" height="3" fill="black"/>
    <rect x="18" y="42" width="3" height="3" fill="#00BCD4"/>
    <rect x="22" y="42" width="3" height="3" fill="black"/>
    <rect x="26" y="42" width="2" height="3" fill="black"/>
    <rect x="29" y="42" width="3" height="3" fill="black"/>
  </g>

  <g stroke="url(#cyanGlow1)" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 100 90 L 100 95 L 100 100 L 105 100" filter="url(#glow1)"/>
    <path d="M 180 90 L 180 95 L 180 100 L 175 100" filter="url(#glow1)"/>
    <path d="M 100 180 L 100 175 L 100 170 L 105 170" filter="url(#glow1)"/>
    <path d="M 180 180 L 180 175 L 180 170 L 175 170" filter="url(#glow1)"/>
  </g>

  <g clip-path="url(#scanArea)">
    <line x1="100" y1="135" x2="180" y2="135" stroke="url(#scanLine)" stroke-width="3" filter="url(#glow1)"/>
    <line x1="100" y1="137" x2="180" y2="137" stroke="#00BCD4" stroke-width="1" opacity="0.3"/>
  </g>

  <circle cx="103" cy="93" r="1.5" fill="#00E5FF" opacity="0.8"/>
  <circle cx="177" cy="93" r="1.5" fill="#00E5FF" opacity="0.8"/>
  <circle cx="103" cy="177" r="1.5" fill="#00E5FF" opacity="0.8"/>
  <circle cx="177" cy="177" r="1.5" fill="#00E5FF" opacity="0.8"/>
</svg>
