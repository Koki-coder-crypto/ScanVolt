<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular cyan-tinted background -->
  <circle cx="140" cy="140" r="140" fill="#00BCD4" fill-opacity="0.1"/>

  <!-- Large QR Code in center -->
  <g transform="translate(90, 90)">
    <rect width="100" height="100" fill="white" rx="4"/>
    <!-- Simplified QR code pattern -->
    <rect x="5" y="5" width="15" height="15" fill="black"/>
    <rect x="25" y="5" width="10" height="15" fill="black"/>
    <rect x="40" y="5" width="8" height="15" fill="black"/>
    <rect x="52" y="5" width="8" height="15" fill="black"/>
    <rect x="65" y="5" width="8" height="15" fill="black"/>
    <rect x="78" y="5" width="15" height="15" fill="black"/>

    <rect x="5" y="25" width="15" height="10" fill="black"/>
    <rect x="78" y="25" width="15" height="10" fill="black"/>

    <rect x="5" y="40" width="15" height="8" fill="black"/>
    <rect x="25" y="40" width="10" height="8" fill="black"/>
    <rect x="52" y="40" width="8" height="8" fill="black"/>
    <rect x="78" y="40" width="15" height="8" fill="black"/>

    <rect x="5" y="52" width="15" height="8" fill="black"/>
    <rect x="40" y="52" width="8" height="8" fill="black"/>
    <rect x="78" y="52" width="15" height="8" fill="black"/>

    <rect x="5" y="65" width="15" height="8" fill="black"/>
    <rect x="25" y="65" width="10" height="8" fill="black"/>
    <rect x="52" y="65" width="8" height="8" fill="black"/>
    <rect x="78" y="65" width="15" height="8" fill="black"/>

    <rect x="5" y="78" width="15" height="15" fill="black"/>
    <rect x="25" y="78" width="10" height="15" fill="black"/>
    <rect x="40" y="78" width="8" height="15" fill="black"/>
    <rect x="52" y="78" width="8" height="15" fill="black"/>
    <rect x="65" y="78" width="8" height="15" fill="black"/>
    <rect x="78" y="78" width="15" height="15" fill="black"/>
  </g>

  <!-- Floating icon bubbles -->
  <!-- Link icon - top left -->
  <g transform="translate(45, 60)">
    <circle cx="20" cy="20" r="20" fill="#00BCD4" fill-opacity="0.2" stroke="#00BCD4" stroke-width="2"/>
    <path d="M 15 18 L 18 15 M 22 22 L 25 19 M 18 15 L 20 13 C 21 12 23 12 24 13 C 25 14 25 16 24 17 L 22 19 M 16 21 L 14 23 C 13 24 11 24 10 23 C 9 22 9 20 10 19 L 12 17" stroke="#00BCD4" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- WiFi icon - top right -->
  <g transform="translate(195, 70)">
    <circle cx="20" cy="20" r="20" fill="#00BCD4" fill-opacity="0.2" stroke="#00BCD4" stroke-width="2"/>
    <path d="M 12 15 C 15 12 25 12 28 15 M 14 18 C 16.5 15.5 23.5 15.5 26 18 M 16 21 C 17.5 19.5 22.5 19.5 24 21 M 20 24 L 20 24.5" stroke="#00BCD4" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Contact icon - bottom -->
  <g transform="translate(110, 205)">
    <circle cx="20" cy="20" r="20" fill="#00BCD4" fill-opacity="0.2" stroke="#00BCD4" stroke-width="2"/>
    <circle cx="20" cy="16" r="4" stroke="#00BCD4" stroke-width="2" fill="none"/>
    <path d="M 13 27 C 13 24 16 22 20 22 C 24 22 27 24 27 27" stroke="#00BCD4" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
