<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="280" height="280" rx="24" fill="#121212"/>

  <!-- Subtle radial glow -->
  <defs>
    <radialGradient id="glow1" cx="140" cy="140" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00BCD4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00BCD4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="140" cy="140" r="120" fill="url(#glow1)"/>

  <!-- Phone frame -->
  <rect x="78" y="28" width="124" height="224" rx="16" fill="#1E1E1E" stroke="#2C2C2C" stroke-width="1.5"/>

  <!-- Phone notch -->
  <rect x="118" y="32" width="44" height="6" rx="3" fill="#2C2C2C"/>

  <!-- Phone screen area -->
  <rect x="86" y="46" width="108" height="194" rx="4" fill="#161616"/>

  <!-- Camera viewfinder area -->
  <rect x="100" y="66" width="80" height="80" rx="2" fill="none"/>

  <!-- Scan corner lines — top-left -->
  <path d="M100 86 L100 70 Q100 66 104 66 L120 66" stroke="#00BCD4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Scan corner lines — top-right -->
  <path d="M160 66 L176 66 Q180 66 180 70 L180 86" stroke="#00BCD4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Scan corner lines — bottom-left -->
  <path d="M100 126 L100 142 Q100 146 104 146 L120 146" stroke="#00BCD4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Scan corner lines — bottom-right -->
  <path d="M160 146 L176 146 Q180 146 180 142 L180 126" stroke="#00BCD4" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- QR Code in center of viewfinder -->
  <g transform="translate(116, 82)">
    <!-- QR positioning squares -->
    <!-- Top-left -->
    <rect x="0" y="0" width="14" height="14" rx="1" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="4" y="4" width="6" height="6" rx="0.5" fill="#FFFFFF"/>
    <!-- Top-right -->
    <rect x="34" y="0" width="14" height="14" rx="1" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="38" y="4" width="6" height="6" rx="0.5" fill="#FFFFFF"/>
    <!-- Bottom-left -->
    <rect x="0" y="34" width="14" height="14" rx="1" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="4" y="38" width="6" height="6" rx="0.5" fill="#FFFFFF"/>
    <!-- QR data modules -->
    <rect x="18" y="2" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="26" y="2" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="18" y="10" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="18" y="18" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="26" y="18" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="34" y="18" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="2" y="18" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="10" y="18" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="18" y="26" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="26" y="26" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="34" y="26" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="42" y="26" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="10" y="34" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="18" y="34" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="26" y="34" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="34" y="34" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="42" y="34" width="4" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="42" y="42" width="6" height="6" rx="0.5" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Horizontal scan line (animated look, static) -->
  <line x1="102" y1="106" x2="178" y2="106" stroke="#00BCD4" stroke-width="1.5" opacity="0.8"/>
  <line x1="108" y1="106" x2="172" y2="106" stroke="#00BCD4" stroke-width="3" opacity="0.3"/>

  <!-- Result card below viewfinder -->
  <rect x="92" y="158" width="96" height="36" rx="8" fill="#2C2C2C"/>
  <!-- Check icon -->
  <circle cx="108" cy="176" r="8" fill="#00BCD4" opacity="0.15"/>
  <path d="M104 176 L107 179 L113 173" stroke="#00BCD4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Result text lines -->
  <rect x="120" y="170" width="56" height="4" rx="2" fill="#B0B0B0" opacity="0.5"/>
  <rect x="120" y="178" width="36" height="3" rx="1.5" fill="#707070" opacity="0.4"/>

  <!-- Second result card -->
  <rect x="92" y="200" width="96" height="28" rx="8" fill="#2C2C2C" opacity="0.5"/>
  <rect x="100" y="210" width="56" height="4" rx="2" fill="#B0B0B0" opacity="0.3"/>
  <rect x="100" y="218" width="36" height="3" rx="1.5" fill="#707070" opacity="0.2"/>

  <!-- Decorative floating dots -->
  <circle cx="56" cy="80" r="3" fill="#00BCD4" opacity="0.3"/>
  <circle cx="48" cy="120" r="2" fill="#00BCD4" opacity="0.2"/>
  <circle cx="224" cy="90" r="3" fill="#00BCD4" opacity="0.3"/>
  <circle cx="232" cy="140" r="2" fill="#00BCD4" opacity="0.2"/>
  <circle cx="60" cy="200" r="2.5" fill="#00BCD4" opacity="0.15"/>
  <circle cx="220" cy="210" r="2.5" fill="#00BCD4" opacity="0.15"/>

  <!-- Home indicator -->
  <rect x="122" y="240" width="36" height="3" rx="1.5" fill="#2C2C2C"/>
</svg>
