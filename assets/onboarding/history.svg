<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular cyan-tinted background -->
  <circle cx="140" cy="140" r="140" fill="#00BCD4" fill-opacity="0.1"/>

  <!-- Container for history interface -->
  <g transform="translate(50, 60)">
    <!-- Search bar -->
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#2C2C2C" stroke="#00BCD4" stroke-width="1.5"/>
    <circle cx="15" cy="18" r="6" stroke="#00BCD4" stroke-width="2" fill="none"/>
    <line x1="19" y1="22" x2="23" y2="26" stroke="#00BCD4" stroke-width="2" stroke-linecap="round"/>
    <text x="32" y="22" fill="#707070" font-size="12" font-family="Inter">Search history...</text>

    <!-- Filter chips -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="42" height="24" rx="12" fill="#00BCD4" fill-opacity="0.2" stroke="#00BCD4" stroke-width="1.5"/>
      <text x="12" y="15" fill="#00BCD4" font-size="10" font-family="Inter" font-weight="600">All</text>

      <rect x="50" y="0" width="50" height="24" rx="12" fill="#2C2C2C"/>
      <text x="60" y="15" fill="#B0B0B0" font-size="10" font-family="Inter">Links</text>

      <rect x="108" y="0" width="50" height="24" rx="12" fill="#2C2C2C"/>
      <text x="118" y="15" fill="#B0B0B0" font-size="10" font-family="Inter">QR</text>
    </g>

    <!-- History card 1 -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="#2C2C2C"/>
      <rect x="10" y="10" width="30" height="30" rx="4" fill="#00BCD4" fill-opacity="0.2"/>
      <path d="M 20 20 L 23 17 M 27 27 L 30 24 M 23 17 L 25 15 C 26 14 28 14 29 15 C 30 16 30 18 29 19 L 27 21 M 21 23 L 19 25 C 18 26 16 26 15 25 C 14 24 14 22 15 21 L 17 19" stroke="#00BCD4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <text x="48" y="20" fill="#FFFFFF" font-size="11" font-family="Inter" font-weight="600">Product Page</text>
      <text x="48" y="32" fill="#707070" font-size="9" font-family="Inter">2 hours ago</text>
    </g>

    <!-- History card 2 -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="#2C2C2C"/>
      <rect x="10" y="10" width="30" height="30" rx="4" fill="#00BCD4" fill-opacity="0.2"/>
      <rect x="18" y="18" width="14" height="14" fill="white" rx="1"/>
      <rect x="19" y="19" width="2" height="2" fill="black"/>
      <rect x="22" y="19" width="2" height="2" fill="black"/>
      <rect x="25" y="19" width="2" height="2" fill="black"/>
      <rect x="28" y="19" width="2" height="2" fill="black"/>
      <rect x="19" y="28" width="2" height="2" fill="black"/>
      <rect x="28" y="28" width="2" height="2" fill="black"/>
      <text x="48" y="20" fill="#FFFFFF" font-size="11" font-family="Inter" font-weight="600">Restaurant Menu</text>
      <text x="48" y="32" fill="#707070" font-size="9" font-family="Inter">Yesterday</text>
    </g>

    <!-- History card 3 (partially visible) -->
    <g transform="translate(0, 204)" opacity="0.7">
      <rect x="0" y="0" width="180" height="20" rx="8" fill="#2C2C2C"/>
      <rect x="10" y="4" width="14" height="12" rx="2" fill="#00BCD4" fill-opacity="0.2"/>
      <text x="32" y="13" fill="#FFFFFF" font-size="10" font-family="Inter" font-weight="600">WiFi Network</text>
    </g>
  </g>
</svg>
