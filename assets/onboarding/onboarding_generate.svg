<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="280" height="280" rx="24" fill="#121212"/>

  <!-- Subtle radial glow -->
  <defs>
    <radialGradient id="glow2" cx="140" cy="140" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00BCD4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00BCD4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="140" cy="140" r="120" fill="url(#glow2)"/>

  <!-- Phone frame -->
  <rect x="78" y="28" width="124" height="224" rx="16" fill="#1E1E1E" stroke="#2C2C2C" stroke-width="1.5"/>

  <!-- Phone notch -->
  <rect x="118" y="32" width="44" height="6" rx="3" fill="#2C2C2C"/>

  <!-- Phone screen area -->
  <rect x="86" y="46" width="108" height="194" rx="4" fill="#161616"/>

  <!-- Large QR Code centered on screen -->
  <g transform="translate(107, 60)">
    <!-- QR positioning squares -->
    <!-- Top-left -->
    <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#00BCD4" stroke-width="2.5"/>
    <rect x="5" y="5" width="8" height="8" rx="1" fill="#00BCD4"/>
    <!-- Top-right -->
    <rect x="48" y="0" width="18" height="18" rx="2" fill="none" stroke="#00BCD4" stroke-width="2.5"/>
    <rect x="53" y="5" width="8" height="8" rx="1" fill="#00BCD4"/>
    <!-- Bottom-left -->
    <rect x="0" y="48" width="18" height="18" rx="2" fill="none" stroke="#00BCD4" stroke-width="2.5"/>
    <rect x="5" y="53" width="8" height="8" rx="1" fill="#00BCD4"/>

    <!-- QR data modules -->
    <rect x="22" y="2" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="30" y="2" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="38" y="2" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="22" y="10" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="38" y="10" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="0" y="22" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="10" y="22" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="22" y="22" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="30" y="22" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="38" y="22" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="48" y="22" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="58" y="22" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="0" y="30" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="22" y="30" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="38" y="30" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="48" y="30" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="0" y="38" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="10" y="38" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="22" y="38" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="30" y="38" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="48" y="38" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="58" y="38" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="22" y="48" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="30" y="48" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="38" y="48" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="48" y="48" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="58" y="48" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="22" y="58" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="38" y="58" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="48" y="58" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="58" y="58" width="5" height="5" fill="#FFFFFF" opacity="0.6"/>
    <!-- Bottom-right alignment -->
    <rect x="58" y="52" width="8" height="8" rx="1" fill="#00BCD4" opacity="0.6"/>
  </g>

  <!-- Floating icon — URL/Link (top-left of phone) -->
  <g transform="translate(38, 58)">
    <circle cx="14" cy="14" r="14" fill="#1E1E1E" stroke="#2C2C2C" stroke-width="1"/>
    <path d="M11 17 L14 14 L17 17" stroke="#00BCD4" stroke-width="0" fill="none"/>
    <!-- Link icon -->
    <path d="M10.5 15.5 Q8 15.5 8 13 Q8 10.5 10.5 10.5 L13 10.5" stroke="#00BCD4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M17.5 12.5 Q20 12.5 20 15 Q20 17.5 17.5 17.5 L15 17.5" stroke="#00BCD4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <line x1="12" y1="16" x2="16" y2="12" stroke="#00BCD4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Floating icon — Wi-Fi (top-right of phone) -->
  <g transform="translate(214, 52)">
    <circle cx="14" cy="14" r="14" fill="#1E1E1E" stroke="#2C2C2C" stroke-width="1"/>
    <!-- Wi-Fi arcs -->
    <path d="M8 13 Q14 6 20 13" stroke="#00BCD4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M10 16 Q14 10 18 16" stroke="#00BCD4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="14" cy="19" r="1.5" fill="#00BCD4"/>
  </g>

  <!-- Floating icon — Contact/Person (bottom-left) -->
  <g transform="translate(42, 155)">
    <circle cx="14" cy="14" r="14" fill="#1E1E1E" stroke="#2C2C2C" stroke-width="1"/>
    <!-- Person icon -->
    <circle cx="14" cy="11" r="3.5" fill="none" stroke="#00BCD4" stroke-width="1.5"/>
    <path d="M7.5 21 Q7.5 16 14 16 Q20.5 16 20.5 21" stroke="#00BCD4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating icon — Email (bottom-right) -->
  <g transform="translate(218, 148)">
    <circle cx="14" cy="14" r="14" fill="#1E1E1E" stroke="#2C2C2C" stroke-width="1"/>
    <!-- Email icon -->
    <rect x="7" y="9" width="14" height="10" rx="2" fill="none" stroke="#00BCD4" stroke-width="1.5"/>
    <path d="M7 10 L14 15 L21 10" stroke="#00BCD4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Share button at bottom of phone screen -->
  <rect x="104" y="198" width="72" height="30" rx="15" fill="#00BCD4"/>
  <!-- Share icon in button -->
  <path d="M132 206 L132 218" stroke="#121212" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M127 210 L132 205 L137 210" stroke="#121212" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Arrow box -->
  <path d="M124 213 L124 218 Q124 220 126 220 L138 220 Q140 220 140 218 L140 213" stroke="#121212" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Decorative connection lines from floating icons to phone -->
  <line x1="66" y1="72" x2="82" y2="80" stroke="#00BCD4" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>
  <line x1="214" y1="66" x2="198" y2="76" stroke="#00BCD4" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>
  <line x1="70" y1="169" x2="86" y2="160" stroke="#00BCD4" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>
  <line x1="218" y1="162" x2="194" y2="150" stroke="#00BCD4" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Decorative floating dots -->
  <circle cx="34" cy="110" r="2" fill="#00BCD4" opacity="0.2"/>
  <circle cx="248" cy="105" r="2.5" fill="#00BCD4" opacity="0.2"/>
  <circle cx="40" cy="210" r="2" fill="#00BCD4" opacity="0.15"/>
  <circle cx="240" cy="215" r="2" fill="#00BCD4" opacity="0.15"/>

  <!-- Home indicator -->
  <rect x="122" y="240" width="36" height="3" rx="1.5" fill="#2C2C2C"/>
</svg>
